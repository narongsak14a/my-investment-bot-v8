name: Run Daily Investment AI

on:
  schedule:
    # 05:30 น. เวลาไทย (UTC+7) = 22:30 น. UTC ของวันก่อนหน้า
    - cron: '30 22 * * *'
  workflow_dispatch: # อนุญาตให้กดรันเองด้วยมือได้ทุกเมื่อ

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          CLOUDFLARE_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_AUTH_TOKEN }}
        run: python main.py
